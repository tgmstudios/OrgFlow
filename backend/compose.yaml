services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: orgflow
      POSTGRES_USER: orgflow
      POSTGRES_PASSWORD: orgflow-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orgflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgflow -d orgflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orgflow-postgres:
