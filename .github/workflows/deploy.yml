name: Deploy
# OrgFlow production = OKE East, namespace `orgflow`, https://orgflow.dev (docs/DEPLOYMENT.md).
#   verify  : frozen installs, typecheck, tests, builds, manifest/shell checks (PRs and pushes; no secrets, hosted runner)
#   image   : one linux/arm64 build per commit, pushed to GHCR by sha tag; the digest is the release identity
#   deploy  : deploy/deploy-east.sh with the namespace-scoped `orgflow-deployer` token (rollout by digest, migration init container)
# The Kubernetes API (138.2.213.132:6443) only accepts a short IP allowlist, so GitHub-hosted runners cannot reach it.
# Set repository variable DEPLOY_RUNNER to an approved runner label that can (see docs/DEPLOYMENT.md); until then the
# deploy job fails fast in its preflight with that exact explanation, and an operator deploys the CI-built digest with
# deploy/deploy-east.sh. Cluster objects (RBAC, NetworkPolicies, ingress, postgres) are applied by an operator, not CI.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "app/**", "Submission Video/**", "OrgFlow_Showcase_Package.zip"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "app/**", "Submission Video/**", "OrgFlow_Showcase_Package.zip"]
  workflow_dispatch:
    inputs:
      digest:
        description: "Deploy/roll back to this existing image digest (sha256:...) without building. Empty = build this ref."
        required: false
        default: ""
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  packages: write
jobs:
  verify:
    if: inputs.digest == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.3" }
      - name: Install (frozen lockfiles, same as the Dockerfile)
        run: |
          bun install --cwd backend --frozen-lockfile
          bun install --cwd frontend --frozen-lockfile
          bun install --cwd landing --frozen-lockfile
          cd backend && DATABASE_URL=postgresql://build:build@localhost:5432/build bunx --bun prisma generate
      - run: bun run typecheck
      - run: bun run test
      - name: Landing typecheck and tests
        run: cd landing && bun run typecheck && bun run test
      - name: Production builds
        run: bun run build && cd landing && bun run build.ts
      - name: Validate manifests and scripts
        run: |
          bash -n deploy/deploy-east.sh
          python3 - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob("deploy/k8s/*.yaml")):
              docs = [d for d in yaml.safe_load_all(open(f)) if d]
              assert docs, f
              print(f, [d["kind"] for d in docs])
          PY
  image:
    needs: verify
    if: github.event_name != 'pull_request' && inputs.digest == ''
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/tgmstudios/orgflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release identity
        run: |
          echo "image digest: ${{ steps.build.outputs.digest }}"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/tgmstudios/orgflow@${{ steps.build.outputs.digest }}\` (linux/arm64, ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: [image]
    # Runs after a successful build, or directly for a dispatch with an explicit digest (rollback / redeploy of a CI artifact).
    if: always() && github.event_name != 'pull_request' && (needs.image.result == 'success' || (inputs.digest != '' && needs.image.result == 'skipped'))
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-24.04' }}
    env:
      DIGEST: ${{ inputs.digest || needs.image.outputs.digest }}
      DEPLOYED_SHA: ${{ github.sha }}
      KUBE_SERVER: ${{ secrets.EAST_KUBE_SERVER }}
      KUBE_TOKEN: ${{ secrets.EAST_KUBE_TOKEN }}
      KUBE_CA_B64: ${{ secrets.EAST_KUBE_CA_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight (digest format, API reachability)
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad image digest '$DIGEST'"; exit 1; }
          host=${KUBE_SERVER#https://}
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/${host%%:*}/${host##*:}" 2>/dev/null; then
            echo "::error title=Kubernetes API unreachable::This runner cannot reach the OKE East API ($host). The API security list allows only an IP allowlist, so GitHub-hosted runners cannot deploy. Set repo variable DEPLOY_RUNNER to an approved runner label on an allowlisted host, or deploy image ghcr.io/tgmstudios/orgflow@${DIGEST} with deploy/deploy-east.sh (docs/DEPLOYMENT.md)."
            echo "### Deploy blocked: API unreachable from this runner" >> "$GITHUB_STEP_SUMMARY"
            echo "Image built and published: \`ghcr.io/tgmstudios/orgflow@${DIGEST}\`. Deploy it with \`deploy/deploy-east.sh\` from an allowlisted host." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Configure kubectl (namespace-scoped token)
        run: |
          set -euo pipefail
          umask 077
          kc="$RUNNER_TEMP/kubeconfig"
          echo "$KUBE_CA_B64" | base64 -d > "$RUNNER_TEMP/ca.crt"
          kubectl config --kubeconfig "$kc" set-cluster east --server="$KUBE_SERVER" --certificate-authority="$RUNNER_TEMP/ca.crt" --embed-certs=true >/dev/null
          kubectl config --kubeconfig "$kc" set-credentials deployer --token="$KUBE_TOKEN" >/dev/null
          kubectl config --kubeconfig "$kc" set-context east --cluster=east --user=deployer --namespace=orgflow >/dev/null
          kubectl config --kubeconfig "$kc" use-context east >/dev/null
          echo "KUBECONFIG=$kc" >> "$GITHUB_ENV"
      - name: Roll out by digest (integration keys merged into orgflow-app)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.PROD_ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.PROD_ELEVENLABS_AGENT_ID }}
          MONETIZATION_APP_ID: ${{ secrets.PROD_MONETIZATION_APP_ID }}
          MONETIZATION_REGISTRY_TOKEN: ${{ secrets.MONETIZATION_REGISTRY_TOKEN }}
          LUMINAL_API_KEY: ${{ secrets.PROD_LUMINAL_API_KEY }}
        run: deploy/deploy-east.sh
      - name: Verify public health
        run: |
          set -euo pipefail
          for u in https://orgflow.dev/health https://orgflow.dev/a/ https://orgflow.dev/; do
            ok=0; for i in $(seq 1 20); do c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$u" || true); [ "$c" = 200 ] && { ok=1; break; }; sleep 6; done
            echo "$u -> $c"; [ "$ok" = 1 ]
          done
          curl -fsS --max-time 10 https://orgflow.dev/health; echo
          echo "voice token (unauth, 401 = configured behind auth, 503 = not configured) -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://orgflow.dev/api/voice/session-token)"
