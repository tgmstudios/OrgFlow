name: Deploy
# Production is OKE East (namespace orgflow, https://orgflow.dev). The former EC2 rsync/SSH deploy was removed at cutover.
# This workflow only builds and publishes the arm64 image; rollout is `kubectl apply -f deploy/k8s` with the pinned digest.
# TODO(approval needed): in-cluster rollout from CI requires a scoped cluster credential stored as a GitHub secret.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, backend/**, frontend/**, landing/**, deploy/landing-serve.ts, demo-content/**, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tgmstudios/orgflow:${{ github.sha }}
            ghcr.io/tgmstudios/orgflow:latest
