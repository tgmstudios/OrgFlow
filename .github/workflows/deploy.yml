name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to instance
        run: |
          for app in landing frontend backend app deploy; do
            [ -d "$app" ] || continue
            rsync -az --delete \
              --exclude 'node_modules' \
              --exclude '.git' \
              --exclude '.env*' \
              --exclude 'data/' \
              --exclude 'dist/' \
              "$app/" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/app/$app/"
          done

      - name: Install dependencies and restart services
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd /opt/app/frontend
            ~/.bun/bin/bun install --frozen-lockfile
            ~/.bun/bin/bun run build
            sudo bash /opt/app/deploy/configure.sh
            for svc in landing frontend backend; do
              cd /opt/app/$svc
              ~/.bun/bin/bun install --frozen-lockfile
              sudo systemctl restart $svc
            done
            sudo systemctl reload nginx
            curl --fail --silent http://127.0.0.1:3002/a/ > /dev/null
            curl --fail --silent http://127.0.0.1:3003/health > /dev/null
          '
