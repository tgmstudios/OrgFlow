name: Image (OKE east)
# Builds the arm64 OrgFlow image for the OKE east cluster. Never deploys; runs only on the deployment branch or manually.
on:
  push:
    branches: [feat/east-oke-deploy]
    paths: [Dockerfile, .dockerignore, backend/**, frontend/**, landing/**, deploy/landing-serve.ts, demo-content/**, .github/workflows/image-east.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tgmstudios/orgflow:east-${{ github.sha }}
            ghcr.io/tgmstudios/orgflow:east-latest
