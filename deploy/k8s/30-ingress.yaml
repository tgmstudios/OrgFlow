# Path routing (the retired EC2 host used the same split: / -> 3001, /a -> 3002, api paths -> 3003). DNS record orgflow.dev is created manually
# (external-dns on this cluster runs with --dry-run).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orgflow
  namespace: orgflow
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [orgflow.dev, www.orgflow.dev]
      secretName: orgflow-tls
  rules:
    - host: orgflow.dev
      http:
        paths:
          - { path: /a, pathType: Prefix, backend: { service: { name: orgflow, port: { name: web } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: orgflow, port: { name: api } } } }
          - { path: /auth, pathType: Prefix, backend: { service: { name: orgflow, port: { name: api } } } }
          - { path: /docs, pathType: Prefix, backend: { service: { name: orgflow, port: { name: api } } } }
          - { path: /swagger, pathType: Exact, backend: { service: { name: orgflow, port: { name: api } } } }
          - { path: /health, pathType: Exact, backend: { service: { name: orgflow, port: { name: api } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: orgflow, port: { name: landing } } } }

---
# Separate Ingress: ingress-nginx only accepts a literal "." path with regex mode, which must not apply to the other paths.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orgflow-openapi
  namespace: orgflow
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [orgflow.dev, www.orgflow.dev]
      secretName: orgflow-tls
  rules:
    - host: orgflow.dev
      http:
        paths:
          - { path: /openapi\.json, pathType: ImplementationSpecific, backend: { service: { name: orgflow, port: { name: api } } } }

---
# www -> apex redirect
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orgflow-www-redirect
  namespace: orgflow
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: "https://orgflow.dev"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [orgflow.dev, www.orgflow.dev]
      secretName: orgflow-tls
  rules:
    - host: www.orgflow.dev
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: orgflow, port: { name: landing } } } }
