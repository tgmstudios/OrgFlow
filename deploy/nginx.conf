user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;
    include /etc/nginx/conf.d/*.conf;
    server {
        listen 80;
        listen [::]:80;
        server_name orgflow.dev www.orgflow.dev;
        client_max_body_size 6m;
        if ($host = www.orgflow.dev) { return 308 https://orgflow.dev$request_uri; }

        location = /a { return 308 /a/; }
        location = /frontend { return 308 /a/; }
        location /frontend/ { return 308 /a/; }

        location /a/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host 127.0.0.1:3002;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 65s;
        }
        location = /api/docs { return 308 /docs; }
        location = /api/openapi.json { return 308 /openapi.json; }
        location = /api/health { return 308 /health; }
        location /api/ {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host 127.0.0.1:3003;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 65s;
        }
        location /auth/ {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host 127.0.0.1:3003;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location ~ ^/(docs(?:/|$)|swagger$|openapi\.json$|health$) {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host 127.0.0.1:3003;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host 127.0.0.1:3001;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
